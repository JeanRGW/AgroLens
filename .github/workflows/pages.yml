name: Release Pages
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Tested release tag (e.g. v0.2.0) or full commit SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Resolve release revision
        id: release
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            commit=$(git rev-parse --verify "$REVISION^{commit}")
          else
            git check-ref-format "refs/tags/$REVISION"
            commit=$(git rev-parse --verify "refs/tags/$REVISION^{commit}")
          fi
          git merge-base --is-ancestor "$commit" origin/main
          git switch --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Build Angular and /m/
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          [[ "$API_URL" == https://* ]]
          pnpm install --frozen-lockfile
          pnpm --filter @agrolens/contracts build
          node <<'NODE'
          const fs = require('fs');
          const file = 'apps/web/src/environments/environment.prod.ts';
          const source = fs.readFileSync(file, 'utf8');
          fs.writeFileSync(file, source.replace(/apiBaseUrl: '[^']*'/, 'apiBaseUrl: ' + JSON.stringify(process.env.API_URL)));
          NODE
          pnpm --filter @agrolens/web build
          (cd apps/mobile && flutter pub get && flutter build web --release --base-href /m/ --no-web-resources-cdn --dart-define="API_BASE_URL=$API_URL")
          cp -r apps/mobile/build/web apps/web/dist/agrolens-web/browser/m
      - name: Deploy static site to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
          REVISION: ${{ steps.release.outputs.commit }}
        run: |
          [[ -n "$PROJECT" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]
          npx --yes wrangler@4.148.0 pages deploy apps/web/dist/agrolens-web/browser --project-name "$PROJECT" --branch main --commit-hash "$REVISION"
          echo "Pages production release: $REVISION" >> "$GITHUB_STEP_SUMMARY"
