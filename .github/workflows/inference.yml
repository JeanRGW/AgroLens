name: Inference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference:
    name: Inference (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/inference
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      # Use test-requirements.txt (fastapi, uvicorn, python-multipart, pillow,
      # pytest, httpx) instead of requirements.txt to avoid pulling in
      # ultralytics / torch. All tests mock the YOLO model, so the heavy
      # ML dependencies are not needed.
      - name: Install test dependencies
        run: pip install -r test-requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
