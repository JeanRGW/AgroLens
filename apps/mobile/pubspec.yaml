name: agrolens
description: "Flutter field app for AgroLens image capture, metadata collection, offline queueing, and backend sync."
publish_to: 'none'
version: 0.1.0+1
license: Apache-2.0
repository: https://github.com/JeanRGW/AgroLens/tree/main/apps/mobile
homepage: https://github.com/JeanRGW/AgroLens/tree/main/apps/mobile#readme
issue_tracker: https://github.com/JeanRGW/AgroLens/issues

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # HTTP / networking
  http: ^1.6.0

  # Platform secure storage for tokens (never SQLite/plain prefs)
  flutter_secure_storage: ^9.2.4

  # Shared SQLite storage on native platforms and web.
  drift: ^2.32.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Browser APIs for the web build (IndexedDB, storage persistence)
  web: ^1.1.1

  # Connectivity monitoring
  connectivity_plus: ^6.1.5

  # UUID for clientUploadId generation
  uuid: ^4.6.0

  # Image picker (gallery multi-select)
  image_picker: ^1.2.3

  # GPS location with permission handling
  geolocator: ^13.0.4

  # Core utilities
  intl: ^0.20.3

  # URL launcher for opening signed download URLs
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.17
  mask_text_input_formatter: ^2.9.0

  # Map-based coordinate picker (OpenStreetMap tiles)
  flutter_map: ^8.3.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_secure_storage_web: ^1.2.1
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.4.14
  geolocator_platform_interface: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
