<!doctype html>
<html lang="pt-BR">
  <head>
    <!--
    The base href below is replaced by the `--base-href` argument of
    `flutter build web` (the PWA is deployed under /m/).
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Aplicativo de campo AgroLens para captura de imagens, coleta de metadados e sincronização offline."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#264b2f" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AgroLens" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>AgroLens</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="register-sw.js" defer></script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
